services:
  reverse-proxy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

  app:
    image: ghcr.io/Caps1d/snippetwall-app:latest
    expose:
      - "8080"
    depends_on:
        db:
            condition: service_healthy
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -d snippetwall -U postgres"]
        interval: 10s
        timeout: 5s
        retries: 5
    restart: on-failure

  db:
    image: postgres:17
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d snippetwall -U postgres"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./internal/models/testdata/setup.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=snippetwall
    expose:
      - "5432"

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

