services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
        db:
            condition: service_healthy
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -d snippetwall -U postgres"]
        interval: 10s
        timeout: 5s
        retries: 5
    restart: on-failure

  db:
    image: postgres:17
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d snippetwall -U postgres"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./internal/models/testdata/setup.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=snippetwall
    ports:
      - "5432:5432"

volumes:
  postgres_data:

